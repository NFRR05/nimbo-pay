<!-- Still renders of the 3D marks, from the same module as the live scenes (src/lib/marks3d.js).
     Serve the repository root (python3 -m http.server 4400) and open /scripts/render-marks.html, then in the console:
     await __render({ mode: "play", width: 1440, height: 1250 })            hero poster (public/media/marks/hero.webp)
     await __render({ mode: "lineup", width: 1120, height: 317 })           call to action poster (lineup.webp)
     await __render({ color: "coral", width: 384, height: 384, blink: true }) small mark, eyes closed (mark-coral-blink.webp)
     await __render({ color: "coral", view: "perch", dark: true, width: 512, height: 512 })   on the product cards (perch-coral.webp)
     Each returns a PNG data URL. The five small marks are cropped to one shared square and saved at 128px, the
     five perch marks to one shared box with the base on the bottom edge and saved 160px wide, all as WebP. -->
